services:
  minio:
    image: minio/minio
    container_name: minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123

    volumes:
      - ${MINIO_DATA}:/data:Z

    command: server /data --console-address ":9001"

    restart: unless-stopped
