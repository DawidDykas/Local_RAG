[project]
name = "app"
version = "0.6.5"
description = "Local RAG backend"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "beautifulsoup4>=4.14.3",
    "boto3>=1.43.2",
    "celery>=5.6.3",
    "fastapi>=0.136.3",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
    "pandas>=3.0.3",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
]


[dependency-groups]
dev = [
    "black",
    "ruff",
    "pytest",
    "pytest-asyncio",
    "mypy",
]


[tool.black]
line-length = 100
target-version = ["py313"]


[tool.ruff]
line-length = 100
target-version = "py313"


[tool.mypy]
python_version = "3.13"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
